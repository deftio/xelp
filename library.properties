sentence=Tiny CLI and script interpreter for embedded systems. 2KB, zero malloc, multi-instance.
paragraph=Gives any Arduino project an interactive serial command line with scriptable command dispatch, single-key menus, and pass-through mode. Works on AVR, ESP32, RP2040, SAMD, STM32, and any board with a Serial port. Includes a C++ wrapper class (XelpCLI) for easy Arduino integration.
