<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xelp BLE Terminal</title>
  <script src="https://cdn.jsdelivr.net/gh/deftio/bitwrench@master/dist/bitwrench.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e; color: #e0e0e0;
      display: flex; flex-direction: column; height: 100vh;
      padding: 12px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 8px; color: #82b1ff; }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px; align-items: center;
    }
    button {
      background: #2d2d44; color: #e0e0e0; border: 1px solid #444;
      border-radius: 4px; padding: 6px 14px; cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #3d3d5c; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.connected { background: #1b5e20; border-color: #4caf50; }
    .status {
      font-size: 0.8rem; color: #888; margin-left: 4px;
    }
    #terminal {
      flex: 1; background: #0d1117; border: 1px solid #333;
      border-radius: 6px; padding: 10px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.85rem; line-height: 1.4;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }
    .input-row {
      display: flex; gap: 6px; margin-top: 8px;
    }
    #cmdInput {
      flex: 1; background: #0d1117; color: #e0e0e0;
      border: 1px solid #444; border-radius: 4px;
      padding: 6px 10px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.85rem;
    }
    #cmdInput:focus { outline: none; border-color: #82b1ff; }
    .quick-btns {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .quick-btns button { font-size: 0.78rem; padding: 4px 10px; }
  </style>
</head>
<body>

<h1>xelp BLE Terminal</h1>

<div class="toolbar">
  <button id="btnConnect" onclick="bleConnect()">Connect</button>
  <button id="btnDisconnect" onclick="bleDisconnect()" disabled>Disconnect</button>
  <span id="statusText" class="status">Not connected</span>
</div>

<div id="terminal"></div>

<div class="input-row">
  <input id="cmdInput" type="text" placeholder="Type a command..."
         autocomplete="off" spellcheck="false" disabled>
  <button id="btnSend" onclick="sendCmd()" disabled>Send</button>
</div>

<div class="quick-btns">
  <button onclick="sendQuick('help')" class="qb">help</button>
  <button onclick="sendQuick('status')" class="qb">status</button>
  <button onclick="sendQuick('led 1')" class="qb">LED ON</button>
  <button onclick="sendQuick('led 0')" class="qb">LED OFF</button>
  <button onclick="sendQuick('adc')" class="qb">ADC</button>
  <button onclick="sendQuick('connect')" class="qb">WiFi Connect</button>
</div>

<script>
/* Nordic UART Service UUIDs */
const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; /* write to device */
const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; /* notify from device */

let device = null;
let rxChar = null;
let txChar = null;

const term   = document.getElementById('terminal');
const input  = document.getElementById('cmdInput');
const status = document.getElementById('statusText');

function termWrite(text) {
  term.textContent += text;
  term.scrollTop = term.scrollHeight;
}

function setConnected(connected) {
  document.getElementById('btnConnect').disabled = connected;
  document.getElementById('btnDisconnect').disabled = !connected;
  document.getElementById('btnConnect').classList.toggle('connected', connected);
  input.disabled = !connected;
  document.getElementById('btnSend').disabled = !connected;
  document.querySelectorAll('.qb').forEach(function(b) { b.disabled = !connected; });
  status.textContent = connected ? 'Connected' : 'Not connected';
  if (connected) input.focus();
}

async function bleConnect() {
  try {
    status.textContent = 'Scanning...';
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS_SERVICE] }]
    });

    device.addEventListener('gattserverdisconnected', function() {
      termWrite('\n[disconnected]\n');
      setConnected(false);
    });

    status.textContent = 'Connecting...';
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(NUS_SERVICE);

    rxChar = await service.getCharacteristic(NUS_RX);
    txChar = await service.getCharacteristic(NUS_TX);

    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', function(e) {
      var val = e.target.value;
      var text = '';
      for (var i = 0; i < val.byteLength; i++) {
        var ch = val.getUint8(i);
        if (ch !== 0x0D) /* strip \r */
          text += String.fromCharCode(ch);
      }
      if (text) termWrite(text);
    });

    setConnected(true);
    termWrite('[connected to ' + device.name + ']\n');

    /* Send a newline to trigger the prompt */
    await sendBytes('\r');
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
}

async function bleDisconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
  setConnected(false);
}

async function sendBytes(str) {
  if (!rxChar) return;
  var encoder = new TextEncoder();
  await rxChar.writeValueWithResponse(encoder.encode(str));
}

async function sendCmd() {
  var cmd = input.value;
  if (!cmd) return;
  termWrite(cmd + '\n');
  await sendBytes(cmd + '\r');
  input.value = '';
  input.focus();
}

async function sendQuick(cmd) {
  termWrite(cmd + '\n');
  await sendBytes(cmd + '\r');
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendCmd(); }
});

/* Initial message */
termWrite('xelp BLE Terminal\n');
termWrite('Click "Connect" to pair with your XIAO ESP32-C6.\n\n');
</script>

</body>
</html>
