version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # xelp is a dependency-free embedded C library -- the only things dependabot
    # can see are the handful of GitHub Actions in .github/workflows.  Group them
    # into a single PR so routine action bumps are one review, not one per action.
    groups:
      github-actions:
        patterns: ["*"]
