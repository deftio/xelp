name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc  # macOS uses Apple Clang natively

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
          fi

      - name: Validate (tests + examples, -Werror)
        run: make validate

      - name: Coverage report (GCC on Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: |
          gcov -o build/ src/xelp.c
          echo "--- Coverage Summary ---"
          gcov -o build/ src/xelp.c 2>/dev/null | grep -A 1 "File.*xelp.c"
