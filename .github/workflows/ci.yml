name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc  # macOS uses Apple Clang natively

    steps:
      - uses: actions/checkout@v4

      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
          fi

      - name: Build and run tests
        run: make tests

      - name: Coverage report (GCC on Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: |
          gcov src/xelp.c
          echo "--- Coverage Summary ---"
          head -3 xelp.c.gcov 2>/dev/null || true

  test-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit support
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Build and run tests (32-bit)
        run: make tests C_FLAGS="-I. -Wall -g -fprofile-arcs -ftest-coverage -m32"
