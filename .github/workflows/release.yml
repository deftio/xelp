name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev

      - name: Extract version from xelp.h
        id: version
        run: |
          mkdir -p build
          gcc tools/extract_version.c -Isrc -o build/extract_version
          build/extract_version build/xelp_version.yaml
          cat build/xelp_version.yaml
          echo "src_version=$(sed -n 's/^version: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT
          echo "src_tag=$(sed -n 's/^tag: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT

      - name: Verify tag matches XELP_VERSION
        run: |
          SRC_VER="${{ steps.version.outputs.src_version }}"
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          echo "Source version: $SRC_VER"
          echo "Tag version:    $TAG_VER"
          if [ "$SRC_VER" != "$TAG_VER" ]; then
            echo "ERROR: Tag $TAG_VER does not match XELP_VERSION $SRC_VER in src/xelp.h"
            exit 1
          fi

      - name: Validate (tests + examples, -Werror)
        run: make validate

      - name: Coverage check
        run: |
          gcov -o build/ src/xelp.c
          echo "--- Coverage Summary ---"
          gcov -o build/ src/xelp.c 2>/dev/null | grep -A 1 "File.*xelp.c"

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          mkdir -p build
          gcc tools/extract_version.c -Isrc -o build/extract_version
          build/extract_version build/xelp_version.yaml
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${{ steps.version.outputs.version }}"
          NOTES=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $VER. See CHANGELOG.md for details."
          fi
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: xelp ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
