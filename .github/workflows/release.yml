name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev cppcheck

      - name: Extract version from xelp.h
        id: version
        run: |
          mkdir -p build
          gcc tools/extract_version.c -Isrc -o build/extract_version
          build/extract_version build/xelp_version.yaml
          cat build/xelp_version.yaml
          echo "src_version=$(sed -n 's/^version: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT
          echo "src_tag=$(sed -n 's/^tag: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT

      - name: Verify tag matches XELP_VERSION
        run: |
          SRC_VER="${{ steps.version.outputs.src_version }}"
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          echo "Source version: $SRC_VER"
          echo "Tag version:    $TAG_VER"
          if [ "$SRC_VER" != "$TAG_VER" ]; then
            echo "ERROR: Tag $TAG_VER does not match XELP_VERSION $SRC_VER in src/xelp.h"
            exit 1
          fi

      - name: Lint (cppcheck static analysis)
        run: make lint

      - name: Validate (tests + examples, -Werror)
        run: make validate

      - name: Coverage check
        run: |
          gcov -o build/ src/xelp.c
          echo "--- Coverage Summary ---"
          gcov -o build/ src/xelp.c 2>/dev/null | grep -A 1 "File.*xelp.c"

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          mkdir -p build
          gcc tools/extract_version.c -Isrc -o build/extract_version
          build/extract_version build/xelp_version.yaml
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' build/xelp_version.yaml)" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${{ steps.version.outputs.version }}"
          # Anchor on the "## [X.Y.Z]" heading for THIS version rather than
          # taking whatever follows the first "## [" heading.  An empty
          # "## [Unreleased]" sitting above the version heading previously
          # yielded empty notes, and the boilerplate fallback made that silent.
          NOTES=$(awk -v ver="$VER" \
            'index($0, "## [" ver "]") == 1 { found=1; next }
             found && /^## \[/ { exit }
             found { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "ERROR: no CHANGELOG entry found for version $VER."
            echo "Expected a '## [$VER] - YYYY-MM-DD' heading with content in CHANGELOG.md."
            echo "Failing rather than publishing a release with placeholder notes."
            exit 1
          fi
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: xelp ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false

  pio-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Publish to PlatformIO registry
        run: pio pkg publish . --no-interactive
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}

  idf-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install idf-component-manager
        run: pip install idf-component-manager

      # --namespace is required.  compote defaults to the "espressif" namespace;
      # locally the right one comes from default_namespace in
      # ~/.espressif/idf_component_manager.yml, which does not exist on a runner.
      # Without it the upload POSTs to components/espressif/xelp and fails.
      # IDF_COMPONENT_API_TOKEN must carry the write:components scope -- a
      # user-scoped token packs fine and then fails at upload.
      - name: Pack and upload to ESP-IDF Component Registry
        run: |
          compote component pack --name xelp
          compote component upload --name xelp --namespace deftio
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
